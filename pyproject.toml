[project]
name = "skill-audit"
version = "2.0"
requires-python = ">=3.14"

# Not a distributable library: the skill scripts are run in place by path and
# the repo ships as a Claude Code plugin (.claude-plugin/), not to PyPI. No
# build backend, so uv treats this as a virtual project.
[tool.uv]
package = false

[dependency-groups]
dev = [
    # evals/az/fixtures/az evaluates --query with the same library az itself uses,
    # so a projected command in an eval returns a real projection
    "jmespath>=1.0",
    "pyright>=1.1.411",
    "pytest>=9",
    # obsidian-metabind parses vault frontmatter with it
    "pyyaml>=6",
    "ruff>=0.15",
]

[tool.ruff]
target-version = "py314"
line-length = 100
# Eval fixtures are snapshots of a target repo, held byte-identical so results stay
# comparable between rounds. Formatting them would change what the skill is measured on.
# `evals/*/hidden/` is the same kind of artifact: a suite written against a fixture,
# run only inside a throwaway copy of a graded run.
# `.claude/skills/skill-creator/` is Anthropic's own skill, vendored for running evals.
# It is upstream code this repo does not own or edit, so it is held as it ships rather
# than reformatted to this repo's rules.
extend-exclude = [
    "evals/*/fixtures/*",
    "**/evals/fixtures/*",
    "evals/*/hidden/*",
    ".claude/skills/skill-creator/*",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade — language-upgrade checks
    "FA",   # flake8-future-annotations — modernization of __future__ usage
    "FURB", # refurb — additional modernization suggestions
    "TC",   # flake8-type-checking — TYPE_CHECKING import discipline
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit (security)
    "PTH",  # flake8-use-pathlib
    "PERF", # perflint
    "TRY",  # tryceratops
    "LOG",  # flake8-logging
    "G",    # flake8-logging-format
    "PIE",  # flake8-pie
    "T20",  # flake8-print
    "ERA",  # eradicate (commented-out code)
    "PL",   # pylint
]
ignore = [
    "S102",    # use of exec — intentional in run_profile
    "T201",    # print — this is a CLI tool
    "TRY003",  # long exception messages
    "PLR2004", # magic value comparisons
    "PLR0911", # too many return statements — main() CLI dispatch has many early returns
    "PLR0912", # too many branches — AST visitors are inherently branchy
    "PLR0913", # too many arguments
    "PLR0917", # too many positional arguments — same rationale as PLR0913
    "PLR0915", # too many statements — main() is CLI dispatch, inherently wordy
]

[tool.ruff.lint.per-file-ignores]
".claude/skills/run-skills/smoke.py" = [
    "S603",    # subprocess argv is built from repo-relative paths, never user input
]
"skills/skill-audit/scripts/perf_check.py" = [
    "ERA001",  # noqa comments are intentional
    "RUF001",  # × in user-facing messages is intentional (multiplication sign)
    "N802",    # visit_* method names are required by ast.NodeVisitor API
]
"skills/skill-audit/scripts/skill_lib.py" = [
    "PLE2502", # intentional BiDi chars — this IS the blocklist being defined
]
"skills/skill-audit/scripts/eval_triggers.py" = [
    "S603",    # subprocess calls the claude CLI — trusted, controlled input
]
"skills/skill-audit/scripts/optimize_description.py" = [
    "S603",    # subprocess calls the claude CLI — trusted, controlled input
]
"skills/skill-audit/scripts/tests/*.py" = [
    "S101",    # assert is correct in tests
    "S603",    # subprocess calls in tests use controlled, trusted input
    "PLE2502", # BiDi chars in test strings are the inputs being tested
]
"skills/create-agents-for-repo/scripts/scan_delegation_targets.py" = [
    "S603",    # subprocess argv is a fixed git invocation over a resolved path, never user text
    "S607",    # `git` is resolved from PATH by design — the tool runs wherever the user's git is
]
"skills/python-performance/scripts/perf_check.py" = [
    "ERA001",  # noqa comments are intentional
    "RUF001",  # × in user-facing messages is intentional (multiplication sign)
    "N802",    # visit_* method names are required by ast.NodeVisitor API
    "TRY300",  # return before except is intentional — matches skill-audit pattern
]
"skills/python-performance/scripts/perf_bench.py" = [
    "S603",    # subprocess argv is sys.executable, the sibling checker, and a fixed git call
    "S607",    # `git` comes from PATH by design — the baseline uses whatever git the repo uses
]
"skills/python-performance/tests/*.py" = [
    "S101",    # assert is correct in tests
    "S603",    # subprocess calls in tests use controlled, trusted input
    "S607",    # `git init` is resolved from PATH, matching the tool under test
]
"skills/agent-tool-builder/scripts/perf_check.py" = [
    "ERA001",  # noqa comments are intentional
    "RUF001",  # × in user-facing messages is intentional (multiplication sign)
    "N802",    # visit_* method names are required by ast.NodeVisitor API
    "TRY300",  # return before except is intentional — matches skill-audit pattern
]
# Harness scripts are run by path (`python3 evals/plan/grade.py …`), so each one puts
# evals/shared on sys.path before it can import from it — an import that cannot come first.
"evals/*/*.py" = [
    "E402",
]
"evals/create-agents-for-repo/*.py" = [
    "S603",    # subprocess argv is built from resolved fixture paths, never user text
    "S607",    # `git` and `diff` come from PATH by design — the harness runs on the dev's tools
]
"evals/az/*.py" = [
    "S603",    # subprocess argv is the resolved claude CLI plus harness-owned prompts
    "S607",    # `az` comes from PATH by design — capture_help.py freezes the dev's CLI
]
"evals/plan/*.py" = [
    "S603",    # subprocess argv is the resolved claude CLI plus harness-owned prompts
]
"evals/python-performance/*.py" = [
    "S603",    # subprocess argv is sys.executable plus resolved harness paths, never user text
    "RUF001",  # × in the speed-up pattern is intentional — runs write "12×", not "12x"
]
"evals/refactor/*.py" = [
    "S603",    # subprocess argv is sys.executable and a fixed git invocation, never user text
    "S607",    # `git` comes from PATH by design — a staged fixture uses the dev's git
]
"evals/shared/*.py" = [
    "S603",    # subprocess argv is the resolved claude CLI plus harness-owned prompts
    "S607",    # `git` comes from PATH by design — a staged fixture uses the dev's git
]
"skills/create-agents-for-repo/tests/*.py" = [
    "S101",    # assert is correct in tests
    "S603",    # subprocess calls in tests use controlled, trusted input
    "S607",    # `git init` is resolved from PATH, matching the tool under test
]
"skills/agent-tool-builder/tests/*.py" = [
    "S101",    # assert is correct in tests
    "S603",    # subprocess calls in tests use controlled, trusted input
]
"skills/obsidian-metabind/scripts/tests/*.py" = [
    "S101",    # assert is correct in tests
    "S603",    # subprocess calls in tests use controlled, trusted input
]
"skills/az/scripts/_common.py" = [
    "S603",    # subprocess invokes the `az` CLI with an argv built from tool flags, never a shell
]
"skills/az/scripts/az-help.py" = [
    "ERA001",  # the two commented lines are sample `az -h` output documenting the regex above them
]
"skills/az/tests/*.py" = [
    "S101",    # assert is correct in tests
    "S603",    # subprocess calls in tests use controlled, trusted input
]
"skills/obsidian-metabind/scripts/refresh_docs.py" = [
    "PLC0415", # urllib is imported inside http_get() so the fetch machinery is only
               # paid for by callers that actually fetch — every test injects a fetcher
               # instead, and perf_check flags the module-level import otherwise
]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.pytest.ini_options]
# Fixture repos carry their own suites; collecting them would run a text adventure
# game's tests as part of this repo's. `.claude/skills/` is symlinks back into
# skills/, so collecting it would run every skill suite a second time — and, with
# no __init__.py, collide on module basenames.
norecursedirs = [
    "evals/*/fixtures",
    # Written against a fixture's `src/`, so it only imports inside a staged copy —
    # grade.py runs it there, this repo's suite cannot.
    "evals/*/hidden",
    ".claude",
    ".venv",
    "node_modules",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["skills", ".claude/skills", "evals"]
# Harness scripts import evals/shared flatly, the way skill scripts import their siblings.
extraPaths = ["evals/shared"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    ".venv",
    "evals/*/fixtures",
    "evals/*/hidden",
    # Vendored upstream — see the ruff exclusion above.
    ".claude/skills/skill-creator",
]
venvPath = "."
venv = ".venv"
